name: Publish saved NFL site

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nfl-page-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Render only after acquiring the publication queue, from latest main.
      # An old full-build artifact must never overwrite a newer saved lock.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate immutable decisions and render saved state
        run: |
          python validate_data_files.py
          python build_site.py --pages-only
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy saved state
        id: deployment
        uses: actions/deploy-pages@v4
