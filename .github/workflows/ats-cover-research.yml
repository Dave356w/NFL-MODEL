name: Research ATS cover probability (exposed history)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/ats_cover_probability.py'
      - 'research/ats_forward_shadow.py'
      - 'tests/test_ats_cover_probability.py'
      - 'data/latest/fixed_band_ledger.csv'
      - '.github/workflows/ats-cover-research.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Chronology and prediction tests
        run: python -m pytest -q tests/test_ats_cover_probability.py
      - name: Historical ATS comparison (research only)
        run: |
          python -m research.ats_cover_probability --input data/latest/fixed_band_ledger.csv --output-dir research/ats_cover_probability_results | tee ats_research_summary.json
      - name: Save auditable game-level observations
        uses: actions/upload-artifact@v4
        with:
          name: ats-cover-probability-research
          path: |
            ats_research_summary.json
            research/ats_cover_probability_results/predictions.csv
            research/ats_cover_probability_results/results.json
