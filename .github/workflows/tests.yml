name: Tests

# Gates changes: data validation, then the pytest suite (which includes the
# model's synthetic self-test). Deliberately NOT wired into build.yml: a test
# failure must never block the build from writing a pregame snapshot that
# cannot be re-derived after kickoff.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Validate committed data
        run: python validate_data_files.py

      - name: Run tests
        run: python -m pytest tests/ -q
