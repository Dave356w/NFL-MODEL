name: Research context support cap
on:
  workflow_dispatch:
  pull_request:
    paths:
      - research/check_replay.py
      - requirements.txt
      - nfl_model.py
      - research/context_shrinkage.py
      - research/qualified_interactions.py
      - research/production_qualification.py
      - research/context_support_cap.py
      - research/CONTEXT_SUPPORT_CAP.md
      - research/support_cap_results/**
      - research/shrinkage_results/frozen_training_features.csv.gz
      - research/restore_v116_results/historical_reproduction.csv
      - research/restore_v116_inputs/**
      - tests/test_context_support_cap.py
      - .github/workflows/context-support-cap.yml
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest numpy==2.3.5 pandas==2.2.3 scipy==1.17.0
      - run: python -m pytest tests/test_context_support_cap.py -q
      - run: python research/check_replay.py research/support_cap_results -- python research/context_support_cap.py
      - run: git diff --exit-code -- research/support_cap_results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: support-cap-results
          path: research/support_cap_results/
          if-no-files-found: error
