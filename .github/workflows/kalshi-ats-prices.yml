name: Audit Kalshi NFL historical prices

on:
  workflow_dispatch:
    inputs:
      season:
        type: choice
        description: NFL season (Kalshi spread contracts start in 2025)
        options: ['2025', '2026']
        default: '2025'
      week:
        description: NFL week
        required: false
        default: '1'
      limit:
        description: Maximum games to request
        required: false
        default: '5'
  push:
    branches: [main]
    paths:
      - 'research/kalshi_ats_prices.py'
      - 'research/ats_forward_shadow.py'
      - 'tests/test_kalshi_ats_prices.py'
      - '.github/workflows/kalshi-ats-prices.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEASON: ${{ github.event.inputs.season || '2025' }}
      WEEK: ${{ github.event.inputs.week || '1' }}
      LIMIT: ${{ github.event.inputs.limit || '5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Validate strict quote handling
        run: pytest -q tests/test_kalshi_ats_prices.py tests/test_ats_cover_probability.py
      - name: Reproduce chronological ATS historical predictions
        run: python -m research.ats_cover_probability --output-dir /tmp/ats_backtest > /tmp/ats_model_summary.json
      - name: Query Kalshi at completed pregame minute candles
        run: |
          python -m research.kalshi_ats_prices --auto-season "$SEASON" --week "$WEEK" \
            --hours-before-kickoff 2 --limit "$LIMIT" \
            --research-predictions /tmp/ats_backtest/predictions.csv \
            --out /tmp/kalshi_historical_audit.csv
      - name: Summarize actual quote coverage
        if: always()
        run: |
          if test -f /tmp/kalshi_historical_audit.csv; then
            python - <<'PY'
          import pandas as pd
          a=pd.read_csv('/tmp/kalshi_historical_audit.csv')
          print('Historical quote coverage by reason:',a.status.value_counts(dropna=False).to_dict())
          print('Alt quote coverage:',a.alternate_status.value_counts(dropna=False).to_dict())
          p='/tmp/kalshi_historical_audit_graded.csv'
          try:
              g=pd.read_csv(p)
              for arm in ('original','fixed_band','cover_probability'):
                  s=g[arm+'_kalshi_units'].dropna()
                  print(arm, 'n',len(s),'units',float(s.sum()),'ROI',float(s.mean()) if len(s) else None)
              if 'original_model_alt_kalshi_units' in g:
                  s=g.original_model_alt_kalshi_units.dropna()
                  print('original_model_alt', 'n',len(s),'units',float(s.sum()),
                        'ROI',float(s.mean()) if len(s) else None)
          except (FileNotFoundError,pd.errors.EmptyDataError):pass
          PY
          fi
      - name: Save source-traceable quote audit and matched ATS grades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-ats-historical-audit
          path: /tmp/kalshi_historical_audit*.csv
          if-no-files-found: warn
