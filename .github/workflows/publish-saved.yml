name: Publish saved ATS selections

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish-saved.yml]

# Rendering committed selections does not write or commit either lock journal.
# It can publish while the model runner is holding for another kickoff group.
concurrency:
  group: publish-saved-site
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate and render saved selections
        run: |
          python validate_data_files.py
          python -c "import build_site; build_site.render_all('public')"
          git diff --exit-code -- data/ats_locks.jsonl data/ats_lock_candidates.jsonl data/forward_predictions.jsonl
      - uses: actions/upload-pages-artifact@v3
        with:
          name: saved-ats-${{ github.run_attempt }}
          path: public
      - name: Deploy saved selections
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: saved-ats-${{ github.run_attempt }}

