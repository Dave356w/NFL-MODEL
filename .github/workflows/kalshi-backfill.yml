name: Backfill Kalshi NFL-only prices

on:
  push:
    branches: [main]
    paths:
      - 'research/kalshi_backfill.py'
      - '.github/workflows/kalshi-backfill.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    name: "${{ matrix.season }} W${{ matrix.week }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {season: 2025, week: 1}
          - {season: 2025, week: 2}
          - {season: 2025, week: 3}
          - {season: 2025, week: 4}
          - {season: 2025, week: 5}
          - {season: 2025, week: 6}
          - {season: 2025, week: 7}
          - {season: 2025, week: 8}
          - {season: 2025, week: 9}
          - {season: 2025, week: 10}
          - {season: 2025, week: 11}
          - {season: 2025, week: 12}
          - {season: 2025, week: 13}
          - {season: 2025, week: 14}
          - {season: 2025, week: 15}
          - {season: 2025, week: 16}
          - {season: 2025, week: 17}
          - {season: 2025, week: 18}
          - {season: 2026, week: 1}
          - {season: 2026, week: 2}
          - {season: 2026, week: 3}
          - {season: 2026, week: 4}
          - {season: 2026, week: 5}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Test Kalshi conversion before retrieving quotes
        run: python -m pytest -q tests/test_kalshi_ats_prices.py
      - name: Fetch all Kalshi games for this season/week
        run: |
          python -m research.kalshi_ats_prices --auto-season "${{ matrix.season }}" \
            --week "${{ matrix.week }}" --limit 99 \
            --hours-before-kickoff 2 --out "/tmp/kalshi_quotes_${{ matrix.season }}_${{ matrix.week }}.csv"
      - name: Archive game-level quotes and missing reasons
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-part-${{ matrix.season }}-${{ matrix.week }}
          path: /tmp/kalshi_quotes_*.csv
          retention-days: 30

  merge:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: site-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: kalshi-part-*
          path: /tmp/kalshi-partitions
          merge-multiple: true
      - name: Generate Kalshi-only historical ledger and ROI
        run: |
          python -m research.ats_cover_probability --output-dir /tmp/ats_baseline > /tmp/ats_baseline_summary.json
          python -m research.kalshi_backfill --partition-dir /tmp/kalshi-partitions \
            --ats /tmp/ats_baseline/predictions.csv --out data/kalshi_historical
          python validate_data_files.py
      - name: Preserve reproducible archive
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-2025-2026-archive
          path: data/kalshi_historical
          retention-days: 90
      - name: Commit validated price archive to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kalshi_historical
          if git diff --cached --quiet; then
            echo "No Kalshi archive updates"
          else
            git commit -m "data: Kalshi NFL verified historical asks and ATS grading"
            git push origin HEAD:main
          fi
