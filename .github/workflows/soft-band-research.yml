name: Research soft neighboring-band margin distributions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/soft_band_distributions.py'
      - 'research/SOFT_BAND_DISTRIBUTIONS.md'
      - 'research/soft_band_distribution_inputs/**'
      - 'research/soft_band_distribution_results/**'
      - 'research/check_replay.py'
      - 'tests/test_soft_band_distributions.py'
      - '.github/workflows/soft-band-research.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest numpy==2.3.5 pandas==2.2.3 scipy==1.17.0
      - name: Verify chronology, empirical distributions and price settlement
        run: python -m pytest tests/test_soft_band_distributions.py -q
      - name: Reproduce the frozen research results
        run: |
          python research/check_replay.py research/soft_band_distribution_results -- python -m research.soft_band_distributions
          git diff --exit-code -- research/soft_band_distribution_results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soft-neighbor-band-research
          path: research/soft_band_distribution_results/
          if-no-files-found: error
