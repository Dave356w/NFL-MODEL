name: Refresh Kalshi historical NFL prices

on:
  workflow_dispatch:
  schedule:
    # After Monday night games; update newly completed games only.
    - cron: '13 17 * * 2'

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Verify Kalshi grading logic
        run: python -m pytest -q tests/test_kalshi_ats_prices.py tests/test_ats_cover_probability.py
      - name: Fetch and grade only previously missing completed NFL games
        run: python -m research.kalshi_incremental
      - name: Validate archive and native ledgers
        run: python validate_data_files.py
      - name: Update persisted Kalshi-only pricing archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kalshi_historical/
          if git diff --cached --quiet; then
            echo "No new completed Kalshi-pricing games"
          else
            git commit -m "data: append completed NFL Kalshi quote coverage"
            git push origin HEAD:main
          fi
