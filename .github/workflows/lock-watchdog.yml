name: Monitor ATS watcher health

on:
  push:
    branches: [main]
    paths:
      - 'lock_watcher.py'
      - 'lock_refresh.py'
      - 'ats_locks.py'
      - 'availability_collect.py'
      - 'espn_spreads.py'
      - 'forecast_history.py'
      - 'nfl_model.py'
      - 'qb_replacement.py'
  workflow_dispatch:
  workflow_run:
    workflows: [Independent ATS lock watcher]
    types: [completed]
  schedule:
    - cron: '3,18,33,48 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: ats-watcher-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restart missing watcher or report stale heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
        run: python lock_watchdog.py --restart-outdated
